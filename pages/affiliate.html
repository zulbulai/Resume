<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Dispense Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%;
            width: 18px; height: 18px; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-btn { transition: all 0.2s; border-bottom: 2px solid transparent; opacity: 0.6; }
        .tab-btn.active { border-color: #4f46e5; color: #4f46e5; opacity: 1; font-weight: 600; }
        
        /* Upload Button Style */
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-800">

    <!-- HEADER -->
    <div class="bg-white px-4 py-3 shadow-sm z-20 flex justify-between items-center border-b">
        <div class="flex items-center gap-2">
            <div class="bg-indigo-600 text-white p-1.5 rounded-lg"><i class="fa-solid fa-robot"></i></div>
            <h1 class="font-bold text-lg tracking-tight">SmartDispense <span class="text-[10px] bg-green-100 text-green-700 px-1 rounded ml-1">Pro</span></h1>
        </div>
        <button onclick="openSettings()" class="text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-gear"></i></button>
    </div>

    <!-- TABS -->
    <div class="bg-white flex shadow-sm z-10">
        <button onclick="switchTab('create')" id="tab-create" class="tab-btn active flex-1 py-3 text-sm text-center">New Product</button>
        <button onclick="switchTab('history')" id="tab-history" class="tab-btn flex-1 py-3 text-sm text-center">Saved Items</button>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto no-scrollbar relative bg-slate-50">
        
        <!-- CREATE TAB -->
        <div id="view-create" class="p-4 pb-24 space-y-4 max-w-lg mx-auto">
            
            <!-- UPLOAD SECTION (Using Your Key) -->
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm text-center relative">
                <!-- Overlay Loader -->
                <div id="uploadOverlay" class="hidden absolute inset-0 bg-white/90 z-20 flex flex-col items-center justify-center rounded-xl">
                    <div class="loader mb-2"></div>
                    <span class="text-xs font-bold text-indigo-600">Uploading to ImgBB...</span>
                </div>

                <div class="flex flex-col items-center gap-4">
                    <!-- Preview Box -->
                    <div class="h-32 w-32 bg-gray-50 rounded-lg overflow-hidden border-2 border-dashed border-gray-300 relative group shadow-inner">
                        <img id="imgPreview" src="https://via.placeholder.com/150?text=No+Image" class="h-full w-full object-cover">
                    </div>
                    
                    <!-- Upload Button -->
                    <div class="w-full">
                        <div class="file-upload-wrapper">
                            <button class="w-full bg-gradient-to-r from-indigo-500 to-indigo-600 text-white py-3 rounded-lg text-sm font-bold shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 active:scale-95">
                                <i class="fa-solid fa-cloud-arrow-up"></i> Upload from Gallery
                            </button>
                            <input type="file" id="fileInput" accept="image/*" onchange="uploadImageToImgBB()">
                        </div>
                    </div>
                    
                    <!-- Manual Link Input -->
                    <div class="w-full relative group">
                        <i class="fa-solid fa-link absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                        <input type="url" id="imageUrl" onchange="previewUrl()" placeholder="Or paste image link manually..." 
                               class="w-full pl-8 p-2 bg-gray-50 border rounded text-xs focus:ring-1 focus:ring-indigo-500 outline-none text-gray-600 transition group-hover:bg-white">
                    </div>
                </div>
            </div>

            <!-- FORM FIELDS -->
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3">
                <div class="grid grid-cols-3 gap-3">
                    <div class="col-span-1">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">Category</label>
                        <select id="category" class="w-full mt-1 p-2 bg-gray-50 border rounded text-xs font-semibold outline-none focus:border-indigo-500">
                            <option>Kitchen tools</option><option>Fashion</option><option>Home</option><option>Beauty</option><option>Deals</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">Title</label>
                        <input type="text" id="title" placeholder="Product Name" class="w-full mt-1 p-2 bg-gray-50 border rounded text-sm font-semibold outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase">Price (₹)</label>
                        <input type="number" id="price" placeholder="999" class="w-full mt-1 p-2 bg-gray-50 border rounded text-green-600 font-bold outline-none focus:border-green-500">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase">MRP (₹)</label>
                        <input type="number" id="mrp" placeholder="1999" class="w-full mt-1 p-2 bg-gray-50 border rounded text-red-400 line-through text-xs outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase">Description</label>
                    <textarea id="description" rows="2" placeholder="Details..." class="w-full mt-1 p-2 bg-gray-50 border rounded text-xs outline-none focus:border-indigo-500"></textarea>
                </div>
            </div>

            <!-- LINKS -->
            <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-2">
                <h3 class="text-[10px] font-bold text-gray-400 uppercase border-b pb-1 mb-1">Affiliate Links</h3>
                <div class="flex items-center gap-2"><i class="fab fa-amazon text-yellow-500 w-5 text-center"></i><input type="url" id="amazonLink" placeholder="Amazon Link" class="flex-1 p-1.5 bg-gray-50 border rounded text-xs"></div>
                <div class="flex items-center gap-2"><i class="fas fa-shopping-bag text-blue-500 w-5 text-center"></i><input type="url" id="flipkartLink" placeholder="Flipkart Link" class="flex-1 p-1.5 bg-gray-50 border rounded text-xs"></div>
                <div class="flex items-center gap-2"><i class="fas fa-box text-pink-500 w-5 text-center"></i><input type="url" id="meeshoLink" placeholder="Meesho Link" class="flex-1 p-1.5 bg-gray-50 border rounded text-xs"></div>
                <div class="flex items-center gap-2"><i class="fas fa-link text-gray-400 w-5 text-center"></i><input type="url" id="extraLink" placeholder="Direct Link" class="flex-1 p-1.5 bg-gray-50 border rounded text-xs"></div>
            </div>
        </div>

        <!-- HISTORY TAB -->
        <div id="view-history" class="hidden h-full flex flex-col">
            <div class="bg-white p-2 shadow-sm sticky top-0 z-10">
                <div class="relative max-w-lg mx-auto">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400 text-xs"></i>
                    <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search..." class="w-full pl-8 p-2 bg-gray-100 rounded-lg text-sm outline-none">
                    <button onclick="loadProducts(true)" class="absolute right-2 top-2 text-indigo-600 p-1"><i class="fa-solid fa-rotate"></i></button>
                </div>
            </div>
            <div id="productList" class="p-4 space-y-3 pb-24 max-w-lg mx-auto w-full"></div>
        </div>
    </main>

    <!-- ACTION BAR -->
    <div id="actionBar" class="fixed bottom-0 w-full bg-white border-t p-2 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-30">
        <div class="max-w-lg mx-auto grid grid-cols-4 gap-2">
            <button onclick="handleSave()" class="flex flex-col items-center justify-center p-2 rounded-lg bg-indigo-50 text-indigo-700 active:bg-indigo-100 transition">
                <div id="saveLoader" class="loader hidden mb-1"></div>
                <i id="saveIcon" class="fa-solid fa-cloud-arrow-up text-lg mb-0.5"></i><span class="text-[10px] font-bold">SAVE</span>
            </button>
            <button onclick="handleTelegram()" class="flex flex-col items-center justify-center p-2 rounded-lg bg-blue-50 text-blue-600 active:bg-blue-100 transition">
                <div id="tgLoader" class="loader hidden mb-1"></div>
                <i id="tgIcon" class="fa-brands fa-telegram text-lg mb-0.5"></i><span class="text-[10px] font-bold">TELEGRAM</span>
            </button>
            <button onclick="sendToWhatsApp()" class="flex flex-col items-center justify-center p-2 rounded-lg bg-green-50 text-green-600 active:bg-green-100 transition">
                <i class="fa-brands fa-whatsapp text-lg mb-0.5"></i><span class="text-[10px] font-bold">WHATSAPP</span>
            </button>
            <button onclick="copyText()" class="flex flex-col items-center justify-center p-2 rounded-lg bg-gray-50 text-gray-600 active:bg-gray-100 transition">
                <i class="fa-regular fa-copy text-lg mb-0.5"></i><span class="text-[10px] font-bold">COPY</span>
            </button>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl p-5 w-full max-w-sm">
            <h2 class="font-bold text-lg mb-4 text-gray-800">Connection Setup</h2>
            <div class="mb-4">
                <label class="text-xs font-bold text-gray-500 uppercase block mb-1">Google Script URL</label>
                <input type="text" id="apiUrlInput" class="w-full p-2 border rounded text-xs bg-gray-50" placeholder="https://script.google.com...">
            </div>
            <div class="flex gap-2">
                <button onclick="saveSettings()" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold text-sm">Save</button>
                <button onclick="document.getElementById('settingsModal').classList.add('hidden')" class="flex-1 bg-gray-200 py-2 rounded-lg font-bold text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-xs shadow-lg z-50 transition-opacity opacity-0 pointer-events-none"></div>

    <script>
        // === CONFIGURATION ===
        // Your last deployed Google Script URL
        let API_URL = "https://script.google.com/macros/s/AKfycbz4b1vXEEQlmZfes_5XPzPjReCnTzAOSAUC49FKKL8cYZkZlt52RJ3QrGxx24VvXAIF9Q/exec";
        
        // YOUR PERSONAL IMGBB API KEY (Hardcoded)
        const YOUR_IMGBB_KEY = "a911a89936b3486d2649df0c87b20ab9"; 

        let allProducts = [];

        // --- INIT ---
        window.onload = function() {
            const savedUrl = localStorage.getItem('gas_url');
            if(savedUrl) API_URL = savedUrl;
            loadProducts();
        };

        // --- UPLOAD LOGIC (Optimized) ---
        async function uploadImageToImgBB() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return;

            // UI Feedback
            document.getElementById('uploadOverlay').classList.remove('hidden');

            const formData = new FormData();
            formData.append("image", file);

            try {
                // Using Your specific API Key
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${YOUR_IMGBB_KEY}`, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    const link = result.data.url;
                    document.getElementById('imageUrl').value = link;
                    document.getElementById('imgPreview').src = link;
                    showToast("✅ Image Ready!");
                } else {
                    console.error("ImgBB Error:", result);
                    showToast("❌ Failed: " + (result.error.message || "Unknown error"), true);
                }
            } catch (error) {
                console.error("Network Error:", error);
                showToast("❌ Network Error", true);
            } finally {
                document.getElementById('uploadOverlay').classList.add('hidden');
            }
        }

        // --- TABS & UI ---
        function switchTab(t) {
            document.getElementById('view-create').classList.add('hidden');
            document.getElementById('view-history').classList.add('hidden');
            document.getElementById('tab-create').classList.remove('active');
            document.getElementById('tab-history').classList.remove('active');
            
            if(t === 'create') {
                document.getElementById('view-create').classList.remove('hidden');
                document.getElementById('tab-create').classList.add('active');
                document.getElementById('actionBar').classList.remove('hidden');
            } else {
                document.getElementById('view-history').classList.remove('hidden');
                document.getElementById('tab-history').classList.add('active');
                document.getElementById('actionBar').classList.add('hidden');
                if(allProducts.length === 0) loadProducts();
            }
        }

        function previewUrl() {
            const u = document.getElementById('imageUrl').value;
            document.getElementById('imgPreview').src = u ? u : 'https://via.placeholder.com/150?text=No+Image';
        }

        function showToast(m, err=false) {
            const t = document.getElementById('toast');
            t.innerText = m;
            t.className = `fixed top-5 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-full text-xs font-bold shadow-lg z-50 transition-opacity opacity-100 ${err ? 'bg-red-600 text-white' : 'bg-green-600 text-white'}`;
            setTimeout(() => t.style.opacity = '0', 2500);
        }

        // --- API & DATA ---
        function getFormData() {
            return {
                category: document.getElementById('category').value,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                price: document.getElementById('price').value,
                mrp: document.getElementById('mrp').value,
                imageUrl: document.getElementById('imageUrl').value,
                amazonLink: document.getElementById('amazonLink').value,
                flipkartLink: document.getElementById('flipkartLink').value,
                meeshoLink: document.getElementById('meeshoLink').value,
                extraLink: document.getElementById('extraLink').value
            };
        }

        async function callApi(action, data={}) {
            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({...data, action}),
                    headers: { "Content-Type": "text/plain;charset=utf-8" }
                });
                return await res.json();
            } catch (e) { return { success: false, error: "Network Error" }; }
        }

        // --- BUTTONS ---
        async function handleSave() {
            const d = getFormData();
            if(!d.title) return showToast("Title Required", true);
            
            document.getElementById('saveIcon').classList.add('hidden');
            document.getElementById('saveLoader').classList.remove('hidden');
            const res = await callApi("save", d);
            document.getElementById('saveIcon').classList.remove('hidden');
            document.getElementById('saveLoader').classList.add('hidden');

            if(res.success) { showToast("✅ Saved!"); loadProducts(true); }
            else showToast("❌ Failed", true);
        }

        async function handleTelegram() {
            const d = getFormData();
            if(!d.imageUrl) return showToast("Upload Image First", true);
            
            document.getElementById('tgIcon').classList.add('hidden');
            document.getElementById('tgLoader').classList.remove('hidden');
            const res = await callApi("telegram", d);
            document.getElementById('tgIcon').classList.remove('hidden');
            document.getElementById('tgLoader').classList.add('hidden');

            if(res.success) showToast("✅ Sent to Telegram!");
            else showToast("❌ Telegram Failed", true);
        }

        // --- LIST ---
        async function loadProducts(force=false) {
            const list = document.getElementById('productList');
            if(force || allProducts.length === 0) list.innerHTML = '<div class="text-center mt-10"><div class="loader mx-auto mb-2"></div><span class="text-xs text-gray-400">Loading...</span></div>';
            
            const res = await callApi("get");
            if(res.success && res.data) {
                allProducts = res.data;
                renderList(allProducts);
            } else list.innerHTML = '<div class="text-center text-xs text-red-400 mt-10">Connection Failed</div>';
        }

        function renderList(arr) {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            if(arr.length === 0) return list.innerHTML = '<div class="text-center text-xs text-gray-400 mt-10">Empty List</div>';
            
            arr.forEach(p => {
                const div = document.createElement('div');
                div.className = "bg-white p-2 rounded-lg shadow-sm border border-gray-100 flex gap-3 cursor-pointer active:bg-slate-50";
                div.onclick = () => {
                    document.getElementById('title').value = p.title;
                    document.getElementById('category').value = p.category;
                    document.getElementById('price').value = p.price;
                    document.getElementById('mrp').value = p.mrp;
                    document.getElementById('description').value = p.description;
                    document.getElementById('imageUrl').value = p.imageUrl;
                    document.getElementById('amazonLink').value = p.amazonLink;
                    document.getElementById('flipkartLink').value = p.flipkartLink;
                    document.getElementById('meeshoLink').value = p.meeshoLink;
                    document.getElementById('extraLink').value = p.extraLink;
                    previewUrl();
                    switchTab('create');
                };
                div.innerHTML = `
                    <div class="h-14 w-14 bg-gray-100 rounded overflow-hidden flex-shrink-0"><img src="${p.imageUrl}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/64'"></div>
                    <div class="flex-1 min-w-0 flex flex-col justify-center">
                        <h4 class="font-bold text-sm truncate text-gray-800">${p.title}</h4>
                        <div class="flex items-center gap-2 mt-0.5"><span class="text-[10px] bg-slate-100 px-1.5 rounded text-gray-500">${p.category}</span><span class="text-xs font-bold text-green-600">₹${p.price}</span></div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function filterProducts() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderList(allProducts.filter(p => p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)));
        }

        // --- SOCIAL ---
        function getMsg() {
            const d = getFormData();
            let t = `🔥 *${d.title}*\n\n${d.description||''}\n💰 *Price: ₹${d.price}* ${d.mrp?`(MRP: ${d.mrp})`:''}\n\n👉 *Buy Now:*`;
            if(d.amazonLink) t+=`\nAmzn: ${d.amazonLink}`;
            if(d.flipkartLink) t+=`\nfkrt: ${d.flipkartLink}`;
            if(d.meeshoLink) t+=`\nMeesho: ${d.meeshoLink}`;
            if(d.extraLink) t+=`\nLink: ${d.extraLink}`;
            return t;
        }
        function sendToWhatsApp() { window.open(`https://wa.me/?text=${encodeURIComponent(getMsg())}`, '_blank'); }
        function copyText() { navigator.clipboard.writeText(getMsg()).then(()=>showToast("Copied!")); }
        
        function openSettings() { 
            document.getElementById('settingsModal').classList.remove('hidden'); 
            document.getElementById('apiUrlInput').value = API_URL;
        }
        function saveSettings() { 
            const u = document.getElementById('apiUrlInput').value;
            if(u) { API_URL = u; localStorage.setItem('gas_url', u); }
            document.getElementById('settingsModal').classList.add('hidden'); 
            loadProducts(true); 
        }
    </script>
</body>
</html>
