<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deal Manager Pro</title>
    
    <!-- Tailwind CSS (Fast Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 (Popups) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        
        /* Custom Scrollbar Hide */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Mobile App Container */
        .app-container {
            max-width: 480px; /* Mobile width limit */
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            padding-bottom: 80px; /* Space for bottom nav */
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 50;
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #9ca3af;
            transition: 0.2s;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: #4f46e5; font-weight: 600; }

        /* Views Animation */
        .view { display: none; animation: fadeIn 0.3s ease-in-out; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Inputs */
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .input-field:focus { border-color: #4f46e5; background: white; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        /* Loader */
        .loader-overlay {
            position: fixed; inset: 0; background: rgba(255,255,255,0.9);
            z-index: 100; display: none; justify-content: center; align-items: center;
            flex-direction: column;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #e5e7eb;
            border-top: 4px solid #4f46e5; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Product Card */
        .prod-card {
            background: white; border-radius: 16px; border: 1px solid #f3f4f6;
            overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            transition: transform 0.1s;
        }
        .prod-card:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- HEADER -->
    <header class="sticky top-0 bg-white/90 backdrop-blur-md z-40 px-5 py-4 border-b border-gray-100 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-gray-800 bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">
                Deal Manager
            </h1>
            <p class="text-xs text-gray-400">Pro Edition</p>
        </div>
        <div class="h-8 w-8 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600">
            <i class="fa-solid fa-user"></i>
        </div>
    </header>

    <!-- LOADER -->
    <div id="loader" class="loader-overlay">
        <div class="spinner mb-3"></div>
        <p class="text-sm text-gray-500 font-medium">Processing...</p>
    </div>

    <!-- VIEW 1: ADD PRODUCT -->
    <div id="view-add" class="view active px-5 py-4">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Add New Product</h2>
        
        <div class="space-y-4">
            <div>
                <label class="text-xs font-semibold text-gray-500 uppercase ml-1">Category</label>
                <select id="inpCat" class="input-field mt-1">
                    <option value="kitchen-tools">Kitchen Tools & Gadgets</option>
                    <option value="home-organization">Home Organization</option>
                    <option value="lighting-decor">Lighting & Home Décor</option>
                    <option value="workspace-setup">Workspace & Desk Setup</option>
                    <option value="smart-home-gadgets">Smart Home Gadgets</option>
                </select>
            </div>

            <div>
                <label class="text-xs font-semibold text-gray-500 uppercase ml-1">Product Title</label>
                <input type="text" id="inpTitle" class="input-field mt-1" placeholder="e.g. Samsung Galaxy M14">
            </div>

            <div>
                <label class="text-xs font-semibold text-gray-500 uppercase ml-1">Image URL</label>
                <div class="flex gap-2">
                    <input type="text" id="inpImg" class="input-field mt-1" placeholder="Paste Link..." oninput="previewImg(this.value)">
                    <img id="addPreview" class="w-12 h-12 rounded-lg object-cover border mt-1 hidden bg-white">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-semibold text-gray-500 uppercase ml-1">Price (₹)</label>
                    <input type="number" id="inpPrice" class="input-field mt-1" placeholder="299">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-500 uppercase ml-1">MRP (₹)</label>
                    <input type="number" id="inpMrp" class="input-field mt-1" placeholder="999">
                </div>
            </div>

            <div>
                <label class="text-xs font-semibold text-gray-500 uppercase ml-1">Description</label>
                <textarea id="inpDesc" class="input-field mt-1" rows="2" placeholder="Short description..."></textarea>
            </div>

            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                <label class="text-xs font-bold text-gray-400 uppercase mb-2 block">Affiliate Links</label>
                <div class="space-y-3">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-yellow-400 flex items-center justify-center text-white text-sm"><i class="fa-brands fa-amazon"></i></div>
                        <input type="text" id="linkAmz" class="input-field p-2 text-sm" placeholder="Amazon Link">
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-blue-500 flex items-center justify-center text-white text-sm">F</div>
                        <input type="text" id="linkFlp" class="input-field p-2 text-sm" placeholder="Flipkart Link">
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-pink-500 flex items-center justify-center text-white text-sm">M</div>
                        <input type="text" id="linkMee" class="input-field p-2 text-sm" placeholder="Meesho Link">
                    </div>
                </div>
            </div>

            <button onclick="saveProduct()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-indigo-200 active:scale-95 transition-all">
                Save to Database
            </button>
            <div class="h-8"></div> <!-- Spacer -->
        </div>
    </div>

    <!-- VIEW 2: LIBRARY (SEARCH) -->
    <div id="view-lib" class="view px-5 py-4">
        <div class="sticky top-0 bg-white z-10 pb-2">
            <h2 class="text-lg font-semibold text-gray-800 mb-3">Product Library</h2>
            <div class="flex gap-2 mb-3">
                <input type="text" id="searchQuery" class="input-field" placeholder="Search products..." onkeyup="debounceSearch()">
                <button onclick="searchDB()" class="bg-indigo-600 text-white w-12 rounded-xl flex items-center justify-center shadow-md active:bg-indigo-800">
                    <i class="fa-solid fa-search"></i>
                </button>
            </div>
            <select id="searchCat" class="input-field text-sm py-2" onchange="searchDB()">
                <option value="All">All Categories</option>
            </select>
        </div>

        <div id="resultsArea" class="grid grid-cols-2 gap-4 mt-2 pb-5">
            <!-- Items will appear here -->
            <div class="col-span-2 text-center py-10 text-gray-400">
                <i class="fa-solid fa-box-open text-4xl mb-2 opacity-50"></i>
                <p class="text-sm">Type to search products</p>
            </div>
        </div>
    </div>

    <!-- VIEW 3: WHATSAPP -->
    <div id="view-wa" class="view px-5 py-4">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">WhatsApp Publisher</h2>
        
        <div id="wa-empty" class="text-center py-10 bg-gray-50 rounded-2xl border border-dashed border-gray-300">
            <i class="fa-regular fa-image text-4xl text-gray-300 mb-2"></i>
            <p class="text-sm text-gray-400">Select a product from Library first</p>
        </div>

        <div id="wa-content" class="hidden animate__animated animate__fadeIn">
            <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm mb-4">
                <img id="waImg" class="w-full h-48 object-contain rounded-lg bg-white">
            </div>

            <label class="text-xs font-semibold text-gray-500 uppercase ml-1 mb-1 block">Message Text</label>
            <textarea id="waText" class="w-full h-40 bg-green-50 text-gray-800 text-sm p-3 rounded-xl border border-green-200 font-mono focus:outline-none" readonly></textarea>

            <div class="grid grid-cols-2 gap-3 mt-4">
                <button onclick="copyWa()" class="bg-gray-800 text-white py-3 rounded-xl font-medium shadow-lg shadow-gray-200 active:scale-95 transition-all">
                    <i class="fa-regular fa-copy mr-1"></i> Copy
                </button>
                <button onclick="sendWa()" class="bg-[#25D366] text-white py-3 rounded-xl font-medium shadow-lg shadow-green-200 active:scale-95 transition-all">
                    <i class="fa-brands fa-whatsapp mr-1"></i> Send
                </button>
            </div>
        </div>
    </div>

    <!-- VIEW 4: TELEGRAM -->
    <div id="view-tg" class="view px-5 py-4">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Telegram Post</h2>

        <div class="mb-4">
            <label class="text-xs font-semibold text-gray-500 uppercase ml-1">Channel Username</label>
            <input type="text" id="tgChannel" class="input-field mt-1" placeholder="@MyChannelName" onchange="localStorage.setItem('tgCh', this.value)">
        </div>

        <div class="bg-[#f0f9ff] border border-blue-100 rounded-2xl p-4 mb-5 relative overflow-hidden">
            <div class="absolute top-0 right-0 bg-blue-500 text-white text-[10px] px-2 py-1 rounded-bl-lg font-bold">PREVIEW</div>
            
            <div class="flex gap-3 items-start">
                <img id="tgImg" class="w-16 h-16 rounded-lg bg-white object-cover border border-blue-100">
                <div>
                    <h4 id="tgTitle" class="text-sm font-bold text-gray-800 line-clamp-2">No Product Selected</h4>
                    <p id="tgPrice" class="text-green-600 font-bold text-sm mt-1">₹0</p>
                </div>
            </div>
            
            <div id="tgBtns" class="flex flex-wrap gap-2 mt-3">
                <div class="h-8 bg-gray-200 rounded-lg w-24 animate-pulse"></div>
                <div class="h-8 bg-gray-200 rounded-lg w-24 animate-pulse"></div>
            </div>
        </div>

        <button onclick="postTelegram()" id="btnTg" class="w-full bg-[#229ED9] hover:bg-[#1e8bc0] text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-200 active:scale-95 transition-all flex justify-center items-center gap-2">
            <i class="fa-regular fa-paper-plane"></i> Post to Channel
        </button>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('add')">
            <i class="fa-solid fa-plus-circle"></i>
            <span>Add</span>
        </button>
        <button class="nav-item" onclick="switchTab('lib')">
            <i class="fa-solid fa-layer-group"></i>
            <span>Library</span>
        </button>
        <button class="nav-item" onclick="switchTab('wa')">
            <i class="fa-brands fa-whatsapp"></i>
            <span>WhatsApp</span>
        </button>
        <button class="nav-item" onclick="switchTab('tg')">
            <i class="fa-brands fa-telegram"></i>
            <span>Telegram</span>
        </button>
    </div>

</div>

<!-- JAVASCRIPT LOGIC -->
<script>
    // 🔥 YOUR PROVIDED SCRIPT URL
    const API_URL = "https://script.google.com/macros/s/AKfycbzqCOmdk5gcTBhroy_gWGNj6wwvZDvYefSO4Y-BNLom1jz5JRQf3ee0nX9QYfJ6VF9bUA/exec";
    
    let currentProduct = null;
    let searchTimeout = null;

    // --- INITIALIZATION ---
    window.onload = () => {
        if(localStorage.getItem("tgCh")) document.getElementById("tgChannel").value = localStorage.getItem("tgCh");
        loadCategories();
    };

    // --- NAVIGATION ---
    function switchTab(id) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById('view-' + id).classList.add('active');
        
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    // --- UTILS ---
    function loader(show) {
        document.getElementById('loader').style.display = show ? 'flex' : 'none';
    }

    function previewImg(url) {
        const img = document.getElementById('addPreview');
        if(url) { img.src = url; img.classList.remove('hidden'); }
        else { img.classList.add('hidden'); }
    }

    // --- 1. SAVE PRODUCT ---
    function saveProduct() {
        const data = {
            action: 'save_product',
            category: document.getElementById('inpCat').value,
            title: document.getElementById('inpTitle').value,
            imageUrl: document.getElementById('inpImg').value,
            price: document.getElementById('inpPrice').value,
            mrp: document.getElementById('inpMrp').value,
            description: document.getElementById('inpDesc').value,
            amazon: document.getElementById('linkAmz').value,
            flipkart: document.getElementById('linkFlp').value,
            meesho: document.getElementById('linkMee').value
        };

        if(!data.title || !data.imageUrl) return Swal.fire('Oops', 'Title & Image are required', 'warning');

        loader(true);
        fetch(API_URL, { method: 'POST', body: JSON.stringify(data) })
        .then(r => r.json())
        .then(res => {
            loader(false);
            if(res.status === 'success') {
                Swal.fire({icon:'success', title:'Saved!', showConfirmButton:false, timer:1500});
                document.getElementById('inpTitle').value = '';
                document.getElementById('inpImg').value = '';
                document.getElementById('addPreview').classList.add('hidden');
            } else Swal.fire('Error', res.data, 'error');
        })
        .catch(() => { loader(false); Swal.fire('Error', 'Network Error', 'error'); });
    }

    // --- 2. SEARCH ---
    function loadCategories() {
        fetch(API_URL, { method: 'POST', body: JSON.stringify({action: 'get_categories'}) })
        .then(r => r.json())
        .then(res => {
            if(res.status === 'success') {
                const sel = document.getElementById('searchCat');
                sel.innerHTML = '<option value="All">All Categories</option>';
                res.data.forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
            }
        });
    }

    function debounceSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(searchDB, 500);
    }

    function searchDB() {
        const query = document.getElementById('searchQuery').value;
        const cat = document.getElementById('searchCat').value;
        const area = document.getElementById('resultsArea');
        
        area.innerHTML = '<div class="col-span-2 text-center py-5"><div class="spinner mx-auto mb-2"></div><span class="text-xs text-gray-400">Searching...</span></div>';

        fetch(API_URL, { method: 'POST', body: JSON.stringify({action:'search_product', query:query, category:cat}) })
        .then(r => r.json())
        .then(res => {
            area.innerHTML = '';
            if(!res.data || res.data.length === 0) {
                area.innerHTML = '<div class="col-span-2 text-center py-5 text-gray-400">No products found</div>';
                return;
            }
            res.data.forEach(prod => {
                let off = "";
                if(prod.mrp && prod.price) off = Math.round(((prod.mrp-prod.price)/prod.mrp)*100) + "% OFF";

                const card = document.createElement('div');
                card.className = 'prod-card';
                card.onclick = () => loadContext(prod);
                card.innerHTML = `
                    <div class="relative h-32 bg-white p-2 border-b border-gray-100">
                        ${off ? `<span class="absolute top-2 right-2 bg-red-100 text-red-600 text-[10px] font-bold px-2 py-0.5 rounded-full">${off}</span>` : ''}
                        <img src="${prod.imageUrl}" class="w-full h-full object-contain">
                    </div>
                    <div class="p-3">
                        <h4 class="text-xs font-bold text-gray-800 line-clamp-1 mb-1">${prod.title}</h4>
                        <div class="flex items-center gap-1">
                            <span class="text-sm font-bold text-green-600">₹${prod.price}</span>
                            <span class="text-[10px] text-gray-400 line-through">₹${prod.mrp}</span>
                        </div>
                    </div>
                `;
                area.appendChild(card);
            });
        });
    }

    // --- 3. LOAD PRODUCT TO CONTEXT ---
    function loadContext(prod) {
        currentProduct = prod;

        // Populate WhatsApp
        document.getElementById('wa-empty').classList.add('hidden');
        document.getElementById('wa-content').classList.remove('hidden');
        document.getElementById('waImg').src = prod.imageUrl;
        
        let links = "";
        if(prod.amazon) links += `👉 Amazon: ${prod.amazon}\n`;
        if(prod.flipkart) links += `👉 Flipkart: ${prod.flipkart}\n`;
        if(prod.meesho) links += `👉 Meesho: ${prod.meesho}\n`;

        let discount = "";
        if(prod.mrp && prod.price) discount = `(${Math.round(((prod.mrp-prod.price)/prod.mrp)*100)}% OFF)`;
        
        const txt = `🔥 *${prod.title}*\n\n💰 *Offer Price: ₹${prod.price}* ${discount}\n❌ MRP: ₹${prod.mrp}\n\n${prod.description||''}\n\n${links}\n✅ *Grab Fast!*`;
        document.getElementById('waText').value = txt;

        // Populate Telegram Preview
        document.getElementById('tgImg').src = prod.imageUrl;
        document.getElementById('tgTitle').innerText = prod.title;
        document.getElementById('tgPrice').innerText = `₹${prod.price} ${discount}`;
        const tgBtns = document.getElementById('tgBtns');
        tgBtns.innerHTML = '';
        if(prod.amazon) tgBtns.innerHTML += `<span class="px-2 py-1 bg-yellow-400 text-white text-[10px] rounded font-bold">Amazon</span>`;
        if(prod.flipkart) tgBtns.innerHTML += `<span class="px-2 py-1 bg-blue-500 text-white text-[10px] rounded font-bold">Flipkart</span>`;
        
        Swal.fire({
            toast: true, position: 'top', icon: 'success', 
            title: 'Product Loaded!', showConfirmButton: false, timer: 1000
        });
    }

    // --- 4. WHATSAPP ACTIONS ---
    function copyWa() {
        const el = document.getElementById('waText');
        el.select(); document.execCommand('copy');
        Swal.fire({toast:true, position:'top', icon:'success', title:'Copied!', showConfirmButton:false, timer:1000});
    }
    function sendWa() {
        const txt = document.getElementById('waText').value;
        window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
    }

    // --- 5. TELEGRAM POST ---
    function postTelegram() {
        if(!currentProduct) return Swal.fire('Oops', 'Select a product first', 'warning');
        const ch = document.getElementById('tgChannel').value;
        if(!ch) return Swal.fire('Oops', 'Enter Channel Username', 'warning');

        const btn = document.getElementById('btnTg');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin animate-spin"></i> Sending...';
        btn.disabled = true;

        let discount = "";
        if(currentProduct.mrp && currentProduct.price) discount = `(${Math.round(((currentProduct.mrp-currentProduct.price)/currentProduct.mrp)*100)}% OFF)`;
        
        const caption = `<b>🔥 Today's Best Deal</b>\n\n<b>${currentProduct.title}</b>\n\n💰 <b>Price: ₹${currentProduct.price}</b> ${discount}\n❌ <strike>MRP: ₹${currentProduct.mrp}</strike>\n\n<i>${currentProduct.description||''}</i>`;

        const payload = {
            action: 'send_telegram',
            channelId: ch,
            imageUrl: currentProduct.imageUrl,
            caption: caption,
            amazon: currentProduct.amazon,
            flipkart: currentProduct.flipkart,
            meesho: currentProduct.meesho
        };

        fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(r => r.json())
        .then(res => {
            btn.innerHTML = originalText; btn.disabled = false;
            if(res.status === 'success') Swal.fire('Success', 'Posted to Telegram', 'success');
            else Swal.fire('Error', res.data, 'error');
        })
        .catch(() => { btn.innerHTML = originalText; btn.disabled = false; Swal.fire('Error', 'Network', 'error'); });
    }

</script>

</body>
</html>
